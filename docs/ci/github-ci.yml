# Copy to .github/workflows/ci.yml — see docs/ci/README.md for why it lives here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lockfile is up to date
        run: cd backend && uv lock --check
      - name: Lint, typecheck, test
        run: make check
      - name: Offline sample (no API keys)
        run: make sample
        env:
          NEBIUS_API_KEY: ""
          TAVILY_API_KEY: ""
